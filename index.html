<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrap">
    <div class="page-heading">
      <p class="small-heading">TODAY'S TASK DESK</p>
      <h1>My To-Do List</h1>
      <p class="intro-text">Write down what's next. Mark tasks done, edit them, or remove them as plans change.</p>
    </div>

    <div class="add-section">
      <h2>Add a task</h2>
      <form id="task-form" class="add-task-form">
        <label for="task-input">Task name</label>
        <div class="input-row">
          <input id="task-input" type="text" placeholder="For example: Finish my homework" required>
          <button class="add-button" type="submit">Add task</button>
        </div>
      </form>
    </div>

    <div class="tasks-section">
      <h2>Your tasks (<span id="task-count">0</span>)</h2>
      <ul id="task-list" class="task-list"></ul>
      <div id="undo-message" class="undo-message">
        <span>Task deleted.</span>
        <button id="undo-button" type="button">Undo</button>
        <span class="undo-time">Undo in <span id="undo-countdown">5</span> seconds</span>
      </div>
      <div id="empty-state" class="empty-state">
        <h3>No tasks yet</h3>
        <p>Add a task using the box above.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
